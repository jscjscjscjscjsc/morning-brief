name: check

# 每个 PR / push 都跑一遍 main.splash 的语法体检。
# 目的：维护者「默认全同意」地批 PR 时，至少语法这一关是机器把过的。
on:
  push:
  pull_request:

# 只读权限（护栏测试占位注释）：即使有人改动了仓库内容让这个流程执行，它也拿不到写权限。
permissions:
  contents: read

jobs:
  brace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: main.splash 语法体检
        run: python tools/brace.py
